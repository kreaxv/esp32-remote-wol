; Build the profile matching the chip and flash hardware.
; Native-USB builds also support UART provisioning through Serial0.

[platformio]
default_envs = esp32

[env]
platform = espressif32
framework = arduino
board_build.f_cpu = 80000000L
lib_deps =
    jnthas/Improv WiFi Library@^0.0.4
    links2004/WebSockets@^2.7.0

[env:esp32]
board = esp32dev

[env:esp32-s2]
board = esp32-s2-saola-1
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c2]
board = esp32-c2-devkitm-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c5]
board = esp32-c5-devkitc-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c6]
board = esp32-c6-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c61]
board = esp32-c61-devkitc1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
